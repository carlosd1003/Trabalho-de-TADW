<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Pokédex</title>
    <link rel="stylesheet" href="style.css" />
    <script src="jquery-3.7.1.min (1).js"></script>
    <script src="jquery.validate.min.js"></script>
    <script>
        // programar a validação do formulário
        $(document).ready(function () {
            $('#login-form').validate({
                rules: {
                    email: {
                        required: true,
                        email: true
                    },
                    senha:{
                        required: true,
                    }
                },
                messages: {
                    email: {
                        required: "Esse campo não pode ser vazio",
                        email: "Por favor, informe um email válido"
                    },
                    senha:{
                        required: "Esse campo não pode ser vazio",
                    }
                },
                // Estilinho do Bootstrap
                highlight: function(el) {
                    // Quando o campo for inválido, adiciona a classe 'is-invalid'
                    // e remove a classe 'is-valid' (para mudar o estilo visual conforme o Bootstrap)
                    el.classList.add('is-invalid');
                    el.classList.remove('is-valid');
                },
                unhighlight: function(el) {
                    // Quando o campo for válido, remove 'is-invalid'
                    // e adiciona 'is-valid' para mostrar o campo com aparência correta
                    el.classList.remove('is-invalid');
                    el.classList.add('is-valid');
                },
                errorElement: 'div',
                // Define que as mensagens de erro serão colocadas dentro de uma <div>

                errorClass: 'invalid-feedback',
                // Define a classe CSS usada nas mensagens de erro (Bootstrap usa essa para estilizar)

                errorPlacement: function(error, element) {
                    // Define onde a mensagem de erro será exibida no HTML

                    if (element.parent('.input-group').length) {
                        // Se o campo estiver dentro de um grupo de inputs (como ícones ou botões),
                        // insere o erro logo depois do grupo inteiro
                        error.insertAfter(element.parent());
                    } else {
                        // Caso contrário, insere o erro logo depois do campo de formulário
                        error.insertAfter(element);
                    }
                }
            });

        });
    </script>
</head>
<body class="cadastro-page-body">
    <div id="login-container" class="form-container animated-container">
        <h1 id="login-title">Bem Vindo ao Site</h1>
        <form id="login-form" action="verificarLogin.php" method="post">
            <label for="email" class="login-label">E-mail:</label>
            <input type="email" id="email" name="email" class="login-input-field" required placeholder="Informe seu e-mail" />

            <label for="senha" class="login-label">Senha:</label>
            <input type="password" id="senha" name="senha" class="login-input-field" required placeholder="Informe sua senha" />

            <a href="formUsuario.php" id="first-access-link">Primeiro acesso</a>

            <input type="submit" id="login-submit-btn" value="Acessar" />
        </form>
    </div>
</body>
</html>
